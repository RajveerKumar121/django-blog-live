{% extends 'base.html' %} {% block content %}

<div class="card">
  <h1>Create an Account</h1>

  <br />

  <form method="post">
    {% csrf_token %} {{ form.as_p }}

    <button type="submit" class="btn">Register</button>
  </form>

  <br />

  <p>
    Already have an account?
    <a href="{% url 'login' %}"> Login here </a>
  </p>
</div>

{% endblock %}
